<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The requested page could not be found on Notes 101.">
  <title>Notes 101 — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #191919;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .error-card {
      text-align: center;
      max-width: 480px;
      padding: 32px 24px;
    }
    .error-title {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ded7ce;
      font-weight: 600;
    }
    .error-desc {
      color: #999999;
      margin-bottom: 24px;
      line-height: 1.6;
      font-size: 15px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: #4080e0;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-primary:hover {
      background: #3367b3;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ded7ce;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested page could not be located. You can return directly to:</p>
    <div class="error-actions">
      <a href="editor.html" class="btn-primary">Open Editor</a>
      <a href="index.html" class="btn-secondary">Home Page</a>
    </div>
  </main>
</body>
</html>
